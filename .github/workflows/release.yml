name: release

# Push a tag like v1.0.0 to build installers and attach them to a DRAFT GitHub
# Release (publish it by hand after a smoke test). "Run workflow" builds the
# same installers as downloadable artifacts without touching Releases.
#
# The 166 MB separation model is fetched here (scripts/fetch-model.mjs, SHA-256
# pinned) and shipped inside the installer via tauri.conf.json bundle.resources,
# so users get stem splitting with no first-run download.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select the pinned Rust toolchain
        run: rustc --version --verbose

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend tooling
        run: npm ci

      - name: Fetch the stem separation model (pinned hash)
        run: npm run fetch-model

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: npm run tauri build -- --bundles nsis

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*.exe dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: samplify-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*.exe

  # The macOS port is built but not yet verified on hardware (docs/STATUS.md), so
  # this job may fail without blocking the Windows release.
  macos:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select the pinned Rust toolchain
        run: rustc --version --verbose

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend tooling
        run: npm ci

      - name: Fetch the stem separation model (pinned hash)
        run: npm run fetch-model

      - name: Build the app icon
        run: bash src-tauri/icons/build_mac_icon.sh

      - name: Build DMG
        run: npm run tauri build -- --bundles dmg

      - name: Collect DMG
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/dmg/*.dmg dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: samplify-macos
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*.dmg
