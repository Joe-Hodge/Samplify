name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select the pinned Rust toolchain
        run: rustc --version --verbose

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Model-free: tauri-build verifies bundle.resources exists even for `cargo test`,
      # so create a zero-byte placeholder to keep CI tests model-free.
      - name: Create model resource placeholder
        shell: bash
        run: |
          mkdir -p src-tauri/resources/models
          touch src-tauri/resources/models/htdemucs_fp16weights.onnx

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: JS tests
        run: npm test
